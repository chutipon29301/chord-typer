name: ChordTyper
options:
  bundleIdPrefix: dev.chutipon
  deploymentTarget:
    macOS: "13.0"

settings:
  SWIFT_VERSION: "6"
  SWIFT_STRICT_CONCURRENCY: complete
  MACOSX_DEPLOYMENT_TARGET: "13.0"
  ENABLE_HARDENED_RUNTIME: NO

targets:
  ChordTyper:
    type: application
    platform: macOS
    sources:
      - path: Sources/ChordTyper
    resources:
      - path: Resources/dictionaries
    info:
      path: Resources/Info.plist
      properties:
        LSUIElement: true
        CFBundleIdentifier: dev.chutipon.chordtyper
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0"
        NSAccessibilityUsageDescription: "ChordTyper needs Accessibility access to intercept keystrokes for chord detection."
    entitlements:
      path: Resources/ChordTyper.entitlements
      properties:
        com.apple.security.temporary-exception.accessibility: true
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: dev.chutipon.chordtyper
      CODE_SIGN_IDENTITY: "-"
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_ENTITLEMENTS: Resources/ChordTyper.entitlements

  ChordTyperTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/ChordTyperTests
    dependencies:
      - target: ChordTyper
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: dev.chutipon.chordtypertests
      GENERATE_INFOPLIST_FILE: YES
